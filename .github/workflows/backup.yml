name: Sicherung

# Woechentliche Kopie ausserhalb von Cloudflare (Abschnitt 14.2).
#
# Time Travel und "d1 export" liegen beim selben Anbieter wie die Datenbank.
# Gegen ein verlorenes Konto helfen sie nicht - dieser Job legt die Kopie
# deshalb in ein privates GitHub-Repository.
#
# Zwei Formate mit Absicht: backup.sql zum Wiedereinspielen, backup.json als
# lesbare Zweitform, die auch dann noch auswertbar ist, wenn es dieses Projekt
# nicht mehr gibt.

on:
  schedule:
    # Sonntag 03:17 UTC. Bewusst nicht zur vollen Stunde: dort stauen sich
    # die Cron-Jobs aller Repositories, und GitHub verzoegert entsprechend.
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

# Zwei gleichzeitige Laeufe wuerden sich beim Push ins Backup-Repo in die
# Quere kommen. Anstellen statt abbrechen.
concurrency:
  group: backup
  cancel-in-progress: false

env:
  APP_URL: https://trophytracker.philipp-ermer-bvb.workers.dev
  BACKUP_REPO: ermerp/trophytracker-backup

jobs:
  sichern:
    name: Dump und JSON ins private Repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: mkdir -p export

      - name: SQL-Dump erzeugen
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 export trophytracker --remote --output=export/backup.sql

      # Aus dem Dump gebaut, nicht ueber den Worker (Nachtrag vom 02.11.2026):
      # GET /api/export/backup.json kostete 212 bis 321 ms CPU gegen die
      # 10-ms-Grenze. Dasselbe Format - dieselbe Tabellenliste, geprueft gegen
      # die Route (14.2). Die Route bleibt fuer den Download von Hand.
      #
      # Die Warnung zum Modultyp betrifft nur das Laden der Tabellenliste aus
      # src/db/export-tabellen.ts und waere im Log bloss Rauschen.
      #
      # continue-on-error: Scheitert der JSON-Teil, wird der Dump trotzdem
      # geprueft und abgelegt - er ist die Sicherung, die sich einspielen
      # laesst (14.2). Rot endet der Lauf dann im letzten Schritt.
      - name: JSON aus dem Dump bauen
        id: json
        continue-on-error: true
        run: |
          set -euo pipefail
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON \
            scripts/json-aus-dump.mjs export/backup.sql export/backup.json

          jq -e '.tabellen.game | length > 0' export/backup.json > /dev/null \
            || { echo "::error::backup.json enthält keine Spiele - Abbruch vor dem Commit"; exit 1; }

          # Gegenprobe zur Tabellenliste in src/db/export.ts: Zugangsdaten und
          # Rohantworten duerfen gar nicht erst im JSON stehen.
          jq -e '.tabellen | has("psn_credentials") or has("psn_raw_response") | not' \
            export/backup.json > /dev/null \
            || { echo "::error::backup.json enthält Zugangsdaten oder Rohantworten"; exit 1; }

          echo "Zeilen je Tabelle:"
          jq -r '.tabellen | to_entries[] | "  \(.key): \(.value | length)"' export/backup.json
          echo "Schemastand: $(jq -r '.schemaVersion' export/backup.json)"

      # Dieselbe Pruefung wie im Deploy-Job: INSERT-Zeilen je Tabelle gegen
      # COUNT(*) der Datenbank. Ein unvollstaendiger Dump darf gar nicht erst
      # committet werden - er wuerde den letzten guten ueberschreiben.
      - name: Sicherung prüfen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/sicherung-pruefen.sh export/backup.sql trophytracker

      # Abnahmekriterium A: kein NPSSO, kein Refresh- oder Access Token im
      # Klartext. Hier ist der Punkt, an dem es zaehlt - danach liegt die
      # Datei dauerhaft in einem Git-Verlauf.
      - name: Dump auf Klartext prüfen
        run: scripts/dump-pruefen.sh export/backup.sql

      # Der Fine-grained PAT reicht ausschliesslich auf das private Repo.
      # Nicht GITHUB_TOKEN: der kommt nicht ueber dieses Repository hinaus.
      # Der Token steckt in der URL; GitHub maskiert Secrets im Log.
      - name: Ins private Repository schreiben
        id: commit
        env:
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
          JSON_OK: ${{ steps.json.outcome == 'success' && 'ja' || 'nein' }}
        run: |
          scripts/sicherung-ablegen.sh export \
            "https://x-access-token:${BACKUP_REPO_TOKEN}@github.com/${BACKUP_REPO}.git" \
            "$JSON_OK"

      # Ein Backup, von dem man nicht weiss, ob es laeuft, ist kein Backup
      # (Abschnitt 14.2). Auch ein Lauf ohne Commit wird vermerkt: "geprueft,
      # nichts Neues" heisst, dass die Sicherung lief.
      - name: Erfolg in der App vermerken
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          COMMIT: ${{ steps.commit.outputs.commit }}
        run: |
          set -euo pipefail
          koerper=$(jq -nc --arg z "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg c "$COMMIT" \
            '{zeitpunkt: $z} + (if $c == "" then {} else {commit: $c} end)')
          curl -fsS --retry 3 --retry-delay 5 -X POST \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -H "content-type: application/json" \
            -d "$koerper" \
            "$APP_URL/api/backup/vermerk"
          echo

      # Erst nach dem Vermerk: Der Dump liegt ab und ist geprueft, die
      # Sicherung gilt. Rot wird der Lauf trotzdem, damit ein gescheiterter
      # JSON-Export nicht unbemerkt bleibt (Vorgabe des Nutzers vom 25.10.2026).
      - name: JSON-Teil gescheitert
        if: steps.json.outcome == 'failure'
        run: |
          echo "::error::backup.json gescheitert - backup.sql ist abgelegt, backup.json ist die der Vorwoche"
          exit 1
