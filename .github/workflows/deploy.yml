name: Deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Zwei gleichzeitige Deploys wuerden Migrationen ueberlappen lassen.
# Nicht abbrechen, sondern anstellen: ein halb angewendetes Schema
# ist schlimmer als ein spaeter Deploy.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  pruefen:
    name: Tests und Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    name: Migrationen und Deployment
    needs: pruefen
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Frontend bauen
        run: npm run build

      # Abschnitt 15.2: Sicherung VOR jeder Schemaaenderung. Eine fehlerhafte
      # Migration ist der wahrscheinlichste Weg, Daten zu verlieren.
      #
      # Der Dump wird bewusst NICHT als Artifact hochgeladen: Artifacts eines
      # oeffentlichen Repositories sind ueber den Run-Link herunterladbar, und
      # das waere genau das Risiko "Backup landet im oeffentlichen Repo" aus
      # Abschnitt 17. Er sichert diesen einen Lauf ab und wird mit ihm
      # verworfen. Die dauerhafte Sicherung ins private Repo ist Stufe 8.
      - name: Datenbank sichern
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 export trophytracker --remote --output=backup.sql

      # Ein Export, den niemand prueft, ist eine Sicherung nur dem Namen nach.
      # Die Pruefschleife steht in scripts/sicherung-pruefen.sh, damit Deploy-
      # und Backup-Job dieselbe benutzen. Weicht eine Zahl ab, bricht der Job
      # HIER ab - vor der Migration. Ins Log kommen nur Zahlen, nie Inhalt:
      # der Dump enthaelt die Spielhistorie, und dieses Repository ist
      # oeffentlich.
      - name: Sicherung prüfen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/sicherung-pruefen.sh backup.sql trophytracker

      # Abnahmekriterium A der Stufe 8: Der Dump darf weder NPSSO noch
      # Refresh- oder Access Token im Klartext enthalten. Hier ist es billig
      # zu pruefen und faellt sofort auf, statt erst im Backup-Repo.
      - name: Dump auf Klartext prüfen
        run: scripts/dump-pruefen.sh backup.sql

      # Migrationen laufen VOR dem Deployment, damit neuer Code nie auf ein
      # altes Schema trifft. Umgekehrt muessen sie abwaertskompatibel sein,
      # weil in diesem Moment noch der alte Worker laeuft.
      - name: Migrationen anwenden
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply trophytracker --remote

      # Datenmigrationen hinterlassen ihre Wirkung im Log, damit sie sich
      # gegen eine bekannte Zahl halten laesst.
      #   play_status  (0006): jede zugeordnete Liste mit Fortschritt > 0 (4.2)
      #   review_queue (0007): jede zugeordnete Liste, nie durchgesehen (8.1)
      #   app_setting  (0013): die vier Gewichte der Rangformel geloescht, erwartet 0
      #   plan_entry   (0014): offene To-Do-Eintraege ohne Position nachgefuellt, erwartet 0
      #   Kopplung     (0015): To-Do = am_spielen, Backlog = pausiert; Abweichungen erwartet 0
      #   reviewed_progress_pct (0016): jede gestempelte Liste hat einen Prozentwert, erwartet = gestempelt
      #   Besitz       (0018): offene Wuensche/Kaeufe an Releases mit Besitz (oder am Spiel davon) erledigt, erwartet 0
      #   Cron-Verlauf (0022): alter Einzeleintrag 'cron_letzter_ausgang' geloescht, erwartet 0
      #   Spielzeit    (0023): neue Tabelle psn_played_title, herkunft an digital_entitlement; erwartet 0 PSN-Zeilen vor dem ersten Lauf
      - name: Datenmigrationen protokollieren
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute trophytracker --remote --json --command \
            "SELECT (SELECT COUNT(*) FROM trophy_progress WHERE release_id IS NOT NULL) AS zugeordnet,
                    (SELECT COUNT(*) FROM play_status) AS play_status,
                    (SELECT COUNT(*) FROM trophy_progress WHERE release_id IS NOT NULL AND progress_pct > 0) AS ps_erwartet,
                    (SELECT COUNT(*) FROM review_queue WHERE reason = 'erstimport') AS review_queue,
                    (SELECT COUNT(*) FROM review_queue WHERE reason <> 'erstimport') AS rq_aenderungen,
                    (SELECT COUNT(*) FROM trophy_progress WHERE release_id IS NOT NULL AND reviewed_at IS NULL) AS rq_erwartet,
                    (SELECT COUNT(*) FROM trophy_progress WHERE release_id IS NOT NULL AND progress_pct >= 100 AND reviewed_at IS NOT NULL) AS komplett,
                    (SELECT COUNT(*) FROM app_setting WHERE key LIKE 'w\_%' ESCAPE '\\') AS gewichte,
                    (SELECT COUNT(*) FROM plan_entry WHERE kind = 'todo' AND status = 'offen') AS todo_offen,
                    (SELECT COUNT(*) FROM plan_entry WHERE kind = 'todo' AND status = 'offen' AND position IS NULL) AS todo_ohne_position,
                    (SELECT COUNT(*) FROM plan_entry pe JOIN play_status ps ON ps.release_id = pe.release_id
                       WHERE pe.kind = 'todo' AND pe.status = 'offen' AND ps.status <> 'am_spielen') AS todo_nicht_am_spielen,
                    (SELECT COUNT(*) FROM play_status ps WHERE ps.status IN ('am_spielen','pausiert')
                       AND NOT EXISTS (SELECT 1 FROM plan_entry pe WHERE pe.release_id = ps.release_id
                                         AND pe.kind IN ('todo','backlog') AND pe.status = 'offen')) AS status_ohne_eintrag,
                    (SELECT COUNT(*) FROM plan_entry pe JOIN play_status ps ON ps.release_id = pe.release_id
                       WHERE pe.kind IN ('todo','backlog') AND pe.status = 'offen'
                         AND ps.status IN ('durchgespielt','komplettiert','abgebrochen')) AS offen_trotz_erledigt,
                    (SELECT COUNT(*) FROM trophy_progress WHERE reviewed_at IS NOT NULL) AS gestempelt,
                    (SELECT COUNT(*) FROM trophy_progress WHERE reviewed_progress_pct IS NOT NULL) AS mit_prozent,
                    (SELECT COUNT(*) FROM plan_entry WHERE kind IN ('wunsch','kauf') AND status = 'offen'
                       AND (release_id IN (SELECT release_id FROM physical_copy UNION SELECT release_id FROM digital_entitlement)
                         OR game_id IN (SELECT r.game_id FROM release r WHERE r.id IN (SELECT release_id FROM physical_copy UNION SELECT release_id FROM digital_entitlement)))) AS offen_trotz_besitz,
                    (SELECT COUNT(*) FROM plan_entry WHERE kind IN ('wunsch','kauf') AND status = 'erledigt') AS erledigte_absichten,
                    (SELECT COUNT(*) FROM app_setting WHERE key = 'cron_letzter_ausgang') AS cron_alt,
                    (SELECT COUNT(*) FROM psn_played_title) AS gespielte_titel,
                    (SELECT COUNT(*) FROM digital_entitlement WHERE herkunft = 'nutzer') AS besitz_hand,
                    (SELECT COUNT(*) FROM digital_entitlement WHERE herkunft = 'psn') AS besitz_psn" \
            | jq -r '.[0].results[0] |
                "zugeordnete Listen: \(.zugeordnet)",
                "play_status: \(.play_status) Zeilen, erwartet mindestens \(.ps_erwartet) (zugeordnete Listen mit Fortschritt)",
                "review_queue: \(.review_queue) erstimport, erwartet \(.rq_erwartet) (zugeordnete Listen, nie durchgesehen, unter 100 %); dazu \(.rq_aenderungen) aus der Aenderungserkennung",
                "davon nicht vorgelegt, weil 100 %: \(.komplett)",
                "app_setting: \(.gewichte) Gewichte der Rangformel, erwartet 0 (Migration 0013)",
                "plan_entry: \(.todo_offen) offene To-Do-Eintraege, davon \(.todo_ohne_position) ohne Position, erwartet 0 (Migration 0014)",
                "Kopplung: \(.todo_nicht_am_spielen) To-Do-Eintraege nicht am_spielen, \(.status_ohne_eintrag) am_spielen/pausiert ohne Eintrag, \(.offen_trotz_erledigt) offen trotz erledigter Bewertung, erwartet je 0 (Migration 0015)",
                "reviewed_progress_pct: \(.mit_prozent) Listen mit Prozentwert, erwartet \(.gestempelt) (gestempelte Listen, Migration 0016)",
                "Besitz: \(.offen_trotz_besitz) offene Wuensche/Kaeufe an Releases mit Besitz, erwartet 0; \(.erledigte_absichten) erledigte Wuensche/Kaeufe insgesamt (Migration 0018)",
                "Cron-Verlauf: \(.cron_alt) alte Einzeleintraege, erwartet 0 (Migration 0022)",
                "Spielzeit/Besitz: \(.gespielte_titel) gespielte Titel, \(.besitz_hand) Berechtigungen von Hand, \(.besitz_psn) von PSN erkannt (Migration 0023, vor dem ersten Lauf 0 und 0)"'

      - name: Worker und Assets deployen
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
